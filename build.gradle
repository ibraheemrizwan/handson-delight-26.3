plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
group = 'com.pockyl'
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.architectury.dev/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.named('jar') { from('LICENSE'); from('NOTICE.md') }

version = '1.1.0+26.3.port.1'
base { archivesName = 'handson_delight-fabric-26.3' }
sourceSets.main {
    java.setSrcDirs(['common/src/main/java', 'fabric/src/main/java'])
    resources.setSrcDirs(['common/src/main/resources', 'fabric/src/main/resources'])
}
repositories {
    ivy {
        name = 'DiegesisPortReleases'
        url = 'https://github.com/ibraheemrizwan/diegesis-26.3/releases/download'
        patternLayout { artifact 'v[revision]/diegesis-fabric-26.3-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'com.pockyl.ports' }
    }
}
dependencies {
    if (providers.gradleProperty('diegesisJar').isPresent()) {
        implementation files(providers.gradleProperty('diegesisJar').get())
    } else {
        implementation 'com.pockyl.ports:diegesis:1.0.0-beta.4+26.3.port.1@jar'
    }
    implementation('maven.modrinth:farmers-delight-refabricated:dRScyUeE') { transitive = false }
}

dependencies {
    compileOnly('maven.modrinth:jei:hif1VmML') { transitive = false }
    compileOnly('maven.modrinth:rei:rKsAE6bX') { transitive = false }
    compileOnly('maven.modrinth:architectury-api:1pMaB6So') { transitive = false }
    compileOnly('maven.modrinth:cloth-config:fg2uyxOW') { transitive = false }
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
}
// EMI has no Fabric26.3 release. Preserve its old sources outside this target until an actual target API exists.
sourceSets.main.java.exclude '**/compat/emi/**'

dependencies { compileOnly 'net.fabricmc.fabric-api:fabric-client-gametest-api-v1:6.0.7+4be74c3f5d' }
loom { runs { clientTest {
    client()
    runDir 'run-clienttest'
    vmArg '-Dfabric.client.gametest'
    vmArg '-Dfabric.client.gametest.modid=handson_delight'
} } }

loom { runs { gameTestServer {
    server()
    runDir 'run-gametest'
    vmArg '-Dfabric-api.gametest'
    vmArg '-Dfabric-api.gametest.filter=handson_delight:*'
    vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
} } }

